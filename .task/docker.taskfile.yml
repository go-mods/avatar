# Taskfile for the Docker tasks of the avatar server
# Documentation: https://taskfile.dev
#
# The services are described in docker-compose.yml (image built from the Dockerfile).
# The fonts are read from the assets/ folder, mounted in the container.
#
# Usage:
#   task docker:build    # Build the image
#   task docker:up       # Start the server on http://localhost:8080
#   task docker:logs     # Follow the logs
#   task docker:down     # Stop the server
version: '3'

tasks:

  build:
    desc: "Builds the docker services"
    cmds:
      - echo "Building services..."
      - docker compose pull
      - docker compose build
    silent: true

  up:
    desc: "Starts the docker services"
    cmds:
      - echo "Starting services..."
      - docker compose up -d
      - echo "Avatar server - http://localhost:8080"
      - echo "Example request - http://localhost:8080/api?name=John%20Doe"
      - echo "Example request - http://localhost:8080/api?name=John%20Doe&shape=square&width=200&height=200&backgroundColor=red&fontColor=white&fontFamily=Caprasimo&fontWeight=400&borderWidth=10&borderColor=blue&borderDash=10,10&borderRadius=50&padding=5"
    silent: true

  down:
    desc: "Stops the docker services"
    cmds:
      - echo "Stopping services..."
      - docker compose down
    silent: true

  restart:
    desc: "Restarts the docker services"
    cmds:
      - task: down
      - task: up
    silent: true

  logs:
    desc: "Follows the logs of the docker services"
    cmds:
      - echo "Showing services logs..."
      - docker compose logs -f
    silent: true

  bash:
    desc: "Opens a shell (sh) in the avatar container"
    interactive: true
    cmds:
      - echo "Opening a shell in the avatar container..."
      - docker compose exec avatar sh
    silent: true

  clean:
    desc: "Stops the docker services and removes their volumes and orphan containers"
    cmds:
      - echo "Cleaning services..."
      - docker compose down --volumes --remove-orphans
    silent: true
