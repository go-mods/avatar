# Taskfile for the Docker tasks of the avatar server
# Documentation: https://taskfile.dev
#
# The service is described in compose.yaml (image built from the Dockerfile, tagged with the
# git version). The fonts are kept in a named volume. The image has no shell: use the logs and
# the /health route to look into a running server.
#
# Usage:
#   task docker:build    # Build the image
#   task docker:up       # Start the server and wait until it is healthy
#   task docker:logs     # Follow the logs
#   task docker:down     # Stop the server, the fonts are kept
#   task docker:clean    # Stop the server and remove the fonts and the image
#
# The published port is 8080, or the value of AVATAR_PORT.
version: '3'

vars:
  VERSION:
    sh: git describe --tags --always --dirty

env:
  VERSION: "{{.VERSION}}"

tasks:

  build:
    desc: "Builds the image of the server, tagged with the git version"
    cmds:
      - echo "Building the image {{.VERSION}}..."
      - docker compose build
    silent: true

  up:
    desc: "Starts the server and waits until it is healthy"
    cmds:
      - echo "Starting the server..."
      - docker compose up -d --wait
      - echo "Avatar server - http://localhost:${AVATAR_PORT:-8080}"
    silent: true

  down:
    desc: "Stops the server, the fonts are kept"
    cmds:
      - echo "Stopping the server..."
      - docker compose down
    silent: true

  restart:
    desc: "Restarts the server"
    cmds:
      - task: down
      - task: up
    silent: true

  logs:
    desc: "Follows the logs of the server"
    cmds:
      - docker compose logs -f
    silent: true

  clean:
    desc: "Stops the server and removes its fonts and its image"
    cmds:
      - echo "Cleaning..."
      - docker compose down --volumes --rmi local --remove-orphans
    silent: true
