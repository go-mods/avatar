# Taskfile for Go development tasks management
# Documentation: https://taskfile.dev
#
# Main features:
# - Compilation and testing
# - Linting and security checks (golangci-lint, gosec included)
# - Code formatting (golangci-lint fmt, formatters of .golangci.yml)
# - Dependency management
#
# The tools are checked at their pinned version (go-tools:check-*) before use:
# install them with task go-tools:install.
version: '3'


# Define tasks
tasks:

  default:
    desc: "Executes the complete code validation sequence: cleaning, generation, formatting, verification, linting and tests"
    cmds:
      - task: clean       # Initial cleanup
      - task: generate    # Generates code that might depend on external packages
      - task: fmt         # Format generated and existing code
      - task: vet         # Check for errors
      - task: tidy        # Ensure dependencies are correct
      - task: lint        # Deep analysis, security included
      - task: test        # Run tests

  clean:
    desc: "Cleans the development environment (binaries, coverage files, temporary files)"
    cmds:
      - echo "Cleaning..."
      - rm -f coverage.*
      - rm -rf .task/checksum
      - go clean
    silent: true

  generate:
    desc: "Generates Go code (mock, protobuf, etc.) via go generate for all packages"
    cmds:
      - echo "Generating..."
      - go generate ./...
    silent: true

  fmt:
    desc: "Formats Go code with golangci-lint fmt (formatters of .golangci.yml) and checks EditorConfig"
    sources:
      - "**/*.go"
      - .golangci.yml
    deps: [":go-tools:check-golangci-lint", ":go-tools:check-editorconfig-checker"]
    cmds:
      - echo "Formatting..."
      - golangci-lint fmt ./...
      - editorconfig-checker
    silent: true

  vet:
    desc: "Static analysis of Go code to detect common errors and potential problems"
    cmds:
      - echo "Vetting..."
      - go vet ./...
    silent: true

  tidy:
    desc: "Cleans and updates go.mod and go.sum files to manage dependencies"
    cmds:
      - echo "Tidying..."
      - go mod tidy
    silent: true

  lint:
    desc: "Checks code quality and security with golangci-lint (linters of .golangci.yml)"
    sources:
      - "**/*.go"
      - .golangci.yml
    deps: [":go-tools:check-golangci-lint"]
    cmds:
      - echo "Linting..."
      - golangci-lint run ./...
    silent: true

  test:
    desc: "Runs all project unit tests"
    cmds:
      - echo "Testing..."
      - go test ./...
    silent: true

  test-coverage:
    desc: "Runs tests with coverage report generation (.out and .html formats)"
    cmds:
      - echo "Generating test coverage..."
      - go test -v ./... -covermode=atomic -coverpkg=./... -coverprofile coverage.out
      - go tool cover -html coverage.out -o coverage.html
    silent: true

  update:
    desc: "Updates all project dependencies to their latest compatible versions"
    cmds:
      - echo "Updating dependencies..."
      - go get -u ./...
      - task: tidy
    silent: true
